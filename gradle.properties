# mod_version is the release version: a push to main whose version has no GitHub release yet publishes it
# (docs/releasing.md). The jar is preheat-<mod_version>+mc<minecraft_version>.jar and the mod reports <mod_version>.
mod_version=1.0.0
minecraft_version=26.3
# The Minecraft versions the jar declares it loads on (Fabric's and NeoForge's syntax).
minecraft_range_fabric=~26.3
minecraft_range_neoforge=[26.3,26.4)

org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
