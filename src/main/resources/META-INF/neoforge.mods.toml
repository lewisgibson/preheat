modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/lewisgibson/preheat/issues"

[[mods]]
modId = "preheat"
version = "${version}"
displayName = "Preheat"
logoFile = "assets/preheat/icon.png"
authors = "Lewis Gibson"
displayURL = "https://github.com/lewisgibson/preheat"
description = '''
Cuts the freeze at portals with Iris shaders by preparing every dimension ahead of time
'''

[[mixins]]
config = "preheat.mixins.json"

[[dependencies.preheat]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.preheat]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range_neoforge}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.preheat]]
modId = "iris"
type = "required"
versionRange = "[1.11.4,)"
ordering = "AFTER"
side = "CLIENT"
