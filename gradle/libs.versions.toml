# Every external library and plugin Preheat's build uses, in one place. The game's own jars (Minecraft, both loaders,
# Iris, Sodium, Distant Horizons, Mod Menu) are not here: they are pinned by sha1 in deps.json and fetched into libs/.

[versions]
asm = "9.11.1"
errorprone = "2.51.0"
errorprone-plugin = "5.1.1"
jacoco = "0.8.15"
jspecify = "1.0.1"
junit = "6.1.3"
# The version NeoForge's own loader is built against.
maven-artifact = "3.8.5"
nullaway = "0.14.3"
palantir-java-format = "2.102.0"
spotless = "8.10.4"

[libraries]
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
maven-artifact = { module = "org.apache.maven:maven-artifact", version.ref = "maven-artifact" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
