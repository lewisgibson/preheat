version: 2

updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          gradle-minor-patch:
              update-types: [minor, patch]
      ignore:
          # The version NeoForge's own loader is built against, so it moves with NeoForge, by hand.
          - dependency-name: org.apache.maven:maven-artifact

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          actions-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-minor-patch:
              update-types: [minor, patch]
