name: Security

on:
    workflow_dispatch: {}
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              # The whole history, so the scan can walk the pushed range.
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Install Gitleaks
              run: |
                  curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
                  echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
                  sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
                  gitleaks version

            - name: Scan for Secrets in New Commits
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  set -euo pipefail
                  if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
                      echo "No base SHA, scanning HEAD commit only"
                      RANGE="--max-count=1 ${HEAD_SHA}"
                  else
                      echo "Scanning range ${BASE_SHA}..${HEAD_SHA}"
                      RANGE="${BASE_SHA}..${HEAD_SHA}"
                  fi
                  gitleaks detect --source . --no-banner --verbose --log-opts="${RANGE}"
